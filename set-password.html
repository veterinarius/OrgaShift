<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrgaShift – Neues Passwort festlegen</title>
    <meta name="robots" content="noindex">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root {
            --color-accent: #007AFF;
            --color-text: #f0f0f5;
            --color-text-muted: #8e8e99;
            --color-surface: rgba(18,18,28,0.85);
            --color-surface-glass: rgba(255,255,255,0.07);
            --color-border: rgba(255,255,255,0.1);
            --color-bg: #0a0a0f;
            --radius: 16px;
        }

        body.light {
            --color-text: #1a1a2e;
            --color-text-muted: #5a6376;
            --color-surface: rgba(255,255,255,0.88);
            --color-surface-glass: rgba(0,0,0,0.04);
            --color-border: rgba(0,0,0,0.1);
            --color-bg: #e8edf5;
        }
        body.light { background: var(--color-bg); }
        body.light .card {
            box-shadow: 0 24px 64px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.06) inset;
        }
        body.light .logo h1 { color: #1a1a2e; }
        body.light .form-group input {
            background: rgba(0,0,0,0.04);
            color: var(--color-text);
        }
        body.light .form-group input::placeholder { color: rgba(0,0,0,0.25); }
        body.light .form-group input:focus { background: rgba(0,122,255,0.05); }
        body.light #beamsOverlay { animation: overlayPulseLight 10s ease-in-out infinite; }
        @keyframes overlayPulseLight {
            0%, 100% { background: rgba(232,237,245,0.2); }
            50%       { background: rgba(232,237,245,0.4); }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--color-bg, #0a0a0f);
            transition: background 0.3s ease;
            min-height: 100vh;
            color: var(--color-text);
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #beamsCanvas {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            filter: blur(15px);
            z-index: 0;
            pointer-events: none;
        }
        #beamsOverlay {
            position: fixed; inset: 0;
            z-index: 1;
            pointer-events: none;
            backdrop-filter: blur(50px);
            animation: overlayPulse 10s ease-in-out infinite;
        }
        @keyframes overlayPulse {
            0%, 100% { background: rgba(10,10,15,0.05); }
            50%       { background: rgba(10,10,15,0.15); }
        }

        .wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
        }

        .card {
            background: var(--color-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 40px 36px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05) inset;
            animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
        }
        .logo h1 {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .logo-dot { color: var(--color-accent); }

        .subtitle {
            text-align: center;
            color: var(--color-text-muted);
            font-size: 14px;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .info-box {
            background: rgba(0,122,255,0.08);
            border: 1px solid rgba(0,122,255,0.2);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 24px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .info-box svg { flex-shrink: 0; margin-top: 1px; }
        .info-box p {
            font-size: 13px;
            color: var(--color-accent);
            line-height: 1.5;
        }

        .message {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.45;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .message.error {
            background: rgba(255,59,48,0.12);
            border: 1px solid rgba(255,59,48,0.25);
            color: #ff6b6b;
        }
        .message.success {
            background: rgba(52,199,89,0.12);
            border: 1px solid rgba(52,199,89,0.25);
            color: #5ac87a;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--color-text-muted);
            font-size: 13px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 13px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            color: var(--color-text);
            font-size: 15px;
            transition: all 0.2s ease;
            outline: none;
            font-family: inherit;
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.2); }
        .form-group input:focus {
            border-color: var(--color-accent);
            background: rgba(0,122,255,0.06);
            box-shadow: 0 0 0 3px rgba(0,122,255,0.12);
        }
        .form-group input.valid   { border-color: #34C759; }
        .form-group input.invalid { border-color: #FF3B30; }

        .hint {
            font-size: 11px;
            color: var(--color-text-muted);
            margin-top: 5px;
        }

        .password-strength {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }
        .strength-bar {
            flex: 1;
            height: 3px;
            border-radius: 2px;
            background: var(--color-border);
            transition: background 0.3s;
        }
        .strength-bar.weak   { background: #FF3B30; }
        .strength-bar.medium { background: #FF9500; }
        .strength-bar.strong { background: #34C759; }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--color-accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            font-family: inherit;
        }
        .submit-btn:hover {
            background: #0056CC;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0,122,255,0.4);
        }
        .submit-btn:active  { transform: translateY(0); }
        .submit-btn:disabled {
            background: rgba(255,255,255,0.15);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            color: rgba(255,255,255,0.4);
        }

        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .theme-toggle {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 10;
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1px solid var(--color-border);
            background: var(--color-surface-glass);
            backdrop-filter: blur(12px);
            color: var(--color-text);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            font-size: 18px;
        }
        .theme-toggle:hover {
            background: rgba(0,122,255,0.12);
            border-color: var(--color-accent);
            color: var(--color-accent);
            transform: scale(1.1);
        }

        @media (max-width: 480px) {
            body { align-items: flex-start; padding: 16px; }
            .wrapper { margin: auto; }
            .card { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <canvas id="beamsCanvas" aria-hidden="true"></canvas>
    <div id="beamsOverlay" aria-hidden="true"></div>

    <button class="theme-toggle" id="themeToggle" title="Design wechseln">🌙</button>

    <main class="wrapper">
        <div class="card">
            <div class="logo">
                <h1>Orga<span class="logo-dot">Shift</span></h1>
            </div>
            <p class="subtitle">Neues Passwort festlegen</p>

            <div class="info-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <p id="infoText">Ihr Account wurde mit einem temporären Passwort eingerichtet. Bitte legen Sie jetzt Ihr persönliches Passwort fest.</p>
            </div>

            <div class="message error"   id="errorMessage"></div>
            <div class="message success" id="successMessage"></div>

            <form id="pwForm" novalidate>
                <div class="form-group">
                    <label for="newPassword">Neues Passwort *</label>
                    <input type="password" id="newPassword" name="newPassword" required
                           autocomplete="new-password" placeholder="Mindestens 8 Zeichen">
                    <div class="password-strength">
                        <div class="strength-bar" id="bar1"></div>
                        <div class="strength-bar" id="bar2"></div>
                        <div class="strength-bar" id="bar3"></div>
                    </div>
                    <p class="hint" id="strengthHint"></p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Passwort bestätigen *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                           autocomplete="new-password" placeholder="Passwort wiederholen">
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Passwort festlegen
                </button>
            </form>
        </div>
    </main>

    <script>
    // ── BEAMS BACKGROUND ──
    (function () {
        const canvas = document.getElementById('beamsCanvas');
        const ctx = canvas.getContext('2d');
        let beams = [];
        const BEAM_COUNT = 20;
        const INTENSITY = 1.0;

        function createBeam(w, h) {
            const angle = -35 + Math.random() * 10;
            return {
                x: Math.random() * w * 1.5 - w * 0.25,
                y: Math.random() * h * 1.5 - h * 0.25,
                width: 30 + Math.random() * 60,
                length: h * 2.5,
                angle: angle,
                speed: 0.6 + Math.random() * 1.2,
                opacity: 0.12 + Math.random() * 0.16,
                hue: 190 + Math.random() * 70,
                pulse: Math.random() * Math.PI * 2,
                pulseSpeed: 0.02 + Math.random() * 0.03
            };
        }

        function resetBeam(beam, index, total) {
            const spacing = canvas.width / 3;
            const column = index % 3;
            beam.y       = canvas.height + 100;
            beam.x       = column * spacing + spacing / 2 + (Math.random() - 0.5) * spacing * 0.5;
            beam.width   = 100 + Math.random() * 100;
            beam.speed   = 0.5 + Math.random() * 0.4;
            beam.hue     = 190 + (index * 70) / total;
            beam.opacity = 0.2 + Math.random() * 0.1;
        }

        function drawBeam(beam) {
            ctx.save();
            ctx.translate(beam.x, beam.y);
            ctx.rotate(beam.angle * Math.PI / 180);
            const pulsingOpacity = beam.opacity * (0.8 + Math.sin(beam.pulse) * 0.2) * INTENSITY;
            const g = ctx.createLinearGradient(0, 0, 0, beam.length);
            g.addColorStop(0,   `hsla(${beam.hue},85%,65%,0)`);
            g.addColorStop(0.1, `hsla(${beam.hue},85%,65%,${pulsingOpacity * 0.5})`);
            g.addColorStop(0.4, `hsla(${beam.hue},85%,65%,${pulsingOpacity})`);
            g.addColorStop(0.6, `hsla(${beam.hue},85%,65%,${pulsingOpacity})`);
            g.addColorStop(0.9, `hsla(${beam.hue},85%,65%,${pulsingOpacity * 0.5})`);
            g.addColorStop(1,   `hsla(${beam.hue},85%,65%,0)`);
            ctx.fillStyle = g;
            ctx.fillRect(-beam.width / 2, 0, beam.width, beam.length);
            ctx.restore();
        }

        function updateCanvasSize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width  = window.innerWidth  * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width  = window.innerWidth  + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.scale(dpr, dpr);
            beams = Array.from({ length: BEAM_COUNT }, () =>
                createBeam(window.innerWidth, window.innerHeight)
            );
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.filter = 'blur(35px)';
            beams.forEach((beam, i) => {
                beam.y     -= beam.speed;
                beam.pulse += beam.pulseSpeed;
                if (beam.y + beam.length < -100) resetBeam(beam, i, beams.length);
                drawBeam(beam);
            });
            requestAnimationFrame(animate);
        }

        updateCanvasSize();
        window.addEventListener('resize', updateCanvasSize);
        animate();
    })();

    // ── THEME TOGGLE ──
    (function () {
        const btn  = document.getElementById('themeToggle');
        const body = document.body;
        if (localStorage.getItem('orgashift_theme') === 'light') body.classList.add('light');
        btn.textContent = body.classList.contains('light') ? '☀️' : '🌙';
        btn.addEventListener('click', function () {
            body.classList.toggle('light');
            const isLight = body.classList.contains('light');
            localStorage.setItem('orgashift_theme', isLight ? 'light' : 'dark');
            btn.textContent = isLight ? '☀️' : '🌙';
        });
    })();

    // ── SUPABASE ──
    // Recovery-Modus (Passwort-vergessen-Link) vor Client-Init erkennen,
    // da supabase-js den URL-Hash beim Initialisieren entfernt
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const isRecovery = hashParams.get('type') === 'recovery';
    // Abgelaufene/ungültige Links liefern statt Tokens Fehler-Parameter im Hash,
    // z. B. #error=access_denied&error_code=otp_expired
    const linkError = hashParams.get('error_code') || hashParams.get('error');

    const SUPA_URL = 'https://porfotcajsrjlilliwnx.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvcmZvdGNhanNyamxpbGxpd254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNzkyMDQsImV4cCI6MjA5Njc1NTIwNH0.XdzS6sfUAzk4BK89QNhgyW3dLDdWrJyxCzcod514fCo';
    const sbClient = supabase.createClient(SUPA_URL, SUPA_KEY);

    if (isRecovery) {
        document.getElementById('infoText').textContent =
            'Bitte legen Sie jetzt Ihr neues Passwort fest.';
    }

    // ── LINK-FEHLER (abgelaufen / bereits verwendet) ──
    if (linkError) {
        document.getElementById('pwForm').style.display = 'none';
        document.getElementById('infoText').textContent =
            'Der Link ist ungültig oder abgelaufen.';
        showMessage(
            linkError === 'otp_expired'
                ? 'Dieser Link ist abgelaufen. Bitte fordern Sie auf der Anmeldeseite über „Passwort vergessen?“ einen neuen Link an.'
                : 'Dieser Link ist ungültig oder wurde bereits verwendet. Bitte fordern Sie einen neuen Link an.',
            'error'
        );
        const back = document.createElement('p');
        back.style.cssText = 'text-align:center;margin-top:4px;';
        back.innerHTML = '<a href="login.html" style="color:var(--color-accent);text-decoration:none;font-size:14px;font-weight:500;">Zur Anmeldung</a>';
        document.querySelector('.card').appendChild(back);
    }

    // ── SESSION GUARD ──
    sbClient.auth.getSession().then(async ({ data: { session } }) => {
        if (linkError) return; // Fehlermeldung anzeigen, nicht wegleiten
        if (!session) {
            window.location.href = 'login.html';
            return;
        }
        if (isRecovery) return;

        // Guard against direct URL access when flag is already cleared
        const { data: emp } = await sbClient
            .from('employees')
            .select('must_change_password')
            .eq('employee_auth_id', session.user.id)
            .maybeSingle();

        if (emp && !emp.must_change_password) {
            const dest = sessionStorage.getItem('orgashift_post_pw_redirect') || 'dashboarduser.html';
            sessionStorage.removeItem('orgashift_post_pw_redirect');
            window.location.href = dest;
        }
    });

    // ── PASSWORD STRENGTH ──
    document.getElementById('newPassword').addEventListener('input', function () {
        const pw = this.value;
        const bar1 = document.getElementById('bar1');
        const bar2 = document.getElementById('bar2');
        const bar3 = document.getElementById('bar3');
        const hint = document.getElementById('strengthHint');

        bar1.className = 'strength-bar';
        bar2.className = 'strength-bar';
        bar3.className = 'strength-bar';

        if (pw.length === 0) { hint.textContent = ''; return; }

        const hasLower  = /[a-z]/.test(pw);
        const hasUpper  = /[A-Z]/.test(pw);
        const hasDigit  = /\d/.test(pw);
        const hasSymbol = /[^a-zA-Z0-9]/.test(pw);
        const score = [pw.length >= 8, hasUpper && hasLower, hasDigit || hasSymbol].filter(Boolean).length;

        if (score === 1) {
            bar1.classList.add('weak');
            hint.textContent = 'Schwach – mindestens 8 Zeichen';
            hint.style.color = '#FF3B30';
        } else if (score === 2) {
            bar1.classList.add('medium'); bar2.classList.add('medium');
            hint.textContent = 'Mittel – Groß-/Kleinbuchstaben + Zahl empfohlen';
            hint.style.color = '#FF9500';
        } else {
            bar1.classList.add('strong'); bar2.classList.add('strong'); bar3.classList.add('strong');
            hint.textContent = 'Stark';
            hint.style.color = '#34C759';
        }
    });

    // ── CONFIRM MATCH ──
    document.getElementById('confirmPassword').addEventListener('input', function () {
        const pw  = document.getElementById('newPassword').value;
        const ok  = this.value === pw && this.value.length > 0;
        this.classList.toggle('valid',   ok);
        this.classList.toggle('invalid', this.value.length > 0 && !ok);
    });

    // ── MESSAGES ──
    function showMessage(message, type) {
        const errorDiv   = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        errorDiv.style.display   = 'none';
        successDiv.style.display = 'none';
        const target = type === 'error' ? errorDiv : successDiv;
        target.textContent   = message;
        target.style.display = 'block';
    }

    // ── Leak-Check (HIBP k-Anonymity: nur die ersten 5 Zeichen
    //    des SHA-1-Hashes verlassen den Browser, nie das Passwort) ──
    async function isPasswordPwned(pw) {
        try {
            const digest = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(pw));
            const hex = Array.from(new Uint8Array(digest))
                .map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
            const res = await fetch('https://api.pwnedpasswords.com/range/' + hex.slice(0, 5));
            if (!res.ok) return false;
            return (await res.text()).includes(hex.slice(5));
        } catch (_) {
            return false; // Bei Netzwerkfehlern das Speichern nicht blockieren
        }
    }

    // ── FORM SUBMIT ──
    document.getElementById('pwForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const pw  = document.getElementById('newPassword').value;
        const pw2 = document.getElementById('confirmPassword').value;
        const btn = document.getElementById('submitBtn');

        if (pw.length < 8) {
            showMessage('Das Passwort muss mindestens 8 Zeichen lang sein.', 'error');
            return;
        }
        if (pw !== pw2) {
            showMessage('Die Passwörter stimmen nicht überein.', 'error');
            return;
        }

        btn.disabled  = true;
        btn.innerHTML = '<span class="spinner"></span> Wird gespeichert…';

        if (await isPasswordPwned(pw)) {
            showMessage('Dieses Passwort ist aus Datenlecks bekannt. Bitte wählen Sie ein anderes.', 'error');
            btn.disabled  = false;
            btn.innerHTML = 'Passwort festlegen';
            return;
        }

        const { error: updateError } = await sbClient.auth.updateUser({ password: pw });

        if (updateError) {
            showMessage('Fehler: ' + updateError.message, 'error');
            btn.disabled  = false;
            btn.innerHTML = 'Passwort festlegen';
            return;
        }

        await sbClient.rpc('clear_must_change_password');

        showMessage('Passwort erfolgreich gespeichert. Sie werden weitergeleitet…', 'success');
        btn.innerHTML = 'Gespeichert ✓';

        let dest = sessionStorage.getItem('orgashift_post_pw_redirect') || 'dashboarduser.html';
        sessionStorage.removeItem('orgashift_post_pw_redirect');

        if (isRecovery) {
            const { data: { session } } = await sbClient.auth.getSession();
            const { data: profile } = await sbClient
                .from('profiles').select('role').eq('id', session.user.id).maybeSingle();
            dest = profile?.role === 'admin' ? 'dashboardadmin.html' : 'dashboarduser.html';
        }

        setTimeout(() => { window.location.href = dest; }, 1500);
    });
    </script>
</body>
</html>
